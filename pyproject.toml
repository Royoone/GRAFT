[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-response"
version = "0.1.0"
description = "Genetic-to-drug transcriptional response prediction with GRAFT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "torch>=2.5,<3"]

[project.urls]
Repository = "https://github.com/Royoone/GRAFT"
Reproduction = "https://github.com/Royoone/GRAFT-reproducibility"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
graft = "graft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
